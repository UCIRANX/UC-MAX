# ساخت خودکار keystore (فقط یک‌بار)
# این workflow keystore را می‌سازد، رمزها را تولید می‌کند و آن‌ها را در Secrets ریپو ذخیره می‌کند.
# اگر KEYSTORE_BASE64 از قبل وجود داشته باشد، اجرا متوقف می‌شود تا keystore قبلی بازنویسی نشود،
# چون بازنویسی یعنی آپدیت روی نسخه‌های قبلی دیگر کار نمی‌کند.
name: Keystore bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check prerequisites
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Secret GH_PAT وجود ندارد. ابتدا آن را طبق راهنما بسازید."
            exit 1
          fi
          if gh secret list --repo "$GITHUB_REPOSITORY" | awk '{print $1}' | grep -qx 'KEYSTORE_BASE64'; then
            echo "KEYSTORE_BASE64 از قبل وجود دارد. برای جلوگیری از شکستن آپدیت‌ها، ساخت مجدد انجام نمی‌شود."
            exit 1
          fi

      - name: Generate keystore and store it as secrets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          STORE_PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$STORE_PASS"
          KEY_ALIAS="uc_max"

          keytool -genkeypair -v \
            -keystore uc_max.jks \
            -storetype PKCS12 \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 4096 \
            -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$STORE_PASS" \
            -dname "CN=UC MAX, O=UC MAX, C=IR"

          base64 -w0 uc_max.jks > keystore.b64
          gh secret set KEYSTORE_BASE64 --repo "$GITHUB_REPOSITORY" < keystore.b64
          printf '%s' "$STORE_PASS" | gh secret set KEYSTORE_PASSWORD --repo "$GITHUB_REPOSITORY"
          printf '%s' "$STORE_PASS" | gh secret set KEY_PASSWORD --repo "$GITHUB_REPOSITORY"
          printf '%s' "$KEY_ALIAS" | gh secret set KEY_ALIAS --repo "$GITHUB_REPOSITORY"

          rm -f keystore.b64
          mkdir -p backup
          mv uc_max.jks backup/

      - name: Upload keystore backup (expires in 1 day)
        uses: actions/upload-artifact@v4
        with:
          name: keystore-backup-DOWNLOAD-AND-DELETE
          path: backup/uc_max.jks
          retention-days: 1
